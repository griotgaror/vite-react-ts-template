user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    default_type text/html;
    sendfile on;

    types {
        text/html html;
        application/javascript js;
    }

    server {
        listen 80;

        root /usr/share/nginx/html;

        location = / {
            default_type text/html;
        }

        location ^~ /static/ {
            default_type application/javascript;
        }
    }
}
